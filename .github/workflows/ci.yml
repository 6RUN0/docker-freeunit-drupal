name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # Weekly run of the example with the search profile (example-search).
  schedule:
    - cron: "23 5 * * 3"

# Minimal token: nothing here writes to the repo.
permissions:
  contents: read

# Bound runner usage: a newer push/PR update cancels the still-running one.
# The event is part of the group, so the weekly run and a push to the same
# branch do not cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job carries a timeout-minutes cap: a hung step (network fetch, docker
  # build, scan) would otherwise hold the runner for GitHub's 6-hour default.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: hadolint (test fixture)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: test/fixtures/scripts/Dockerfile

      - name: hadolint (example)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: examples/drupal/Dockerfile

      # The example compose file parses with its .env.example, with and without
      # the search profile and the e2e override, and its copy of the hardening
      # fragment equals the image's.
      - name: example compose config + fragment copy
        run: make lint-compose check-fragment LINT_REQUIRE=1

      # Pin shellcheck to the version used locally so CI mirrors `make lint`.
      # The runner's bundled shellcheck is older and emits false positives that
      # current releases correctly suppress: SC2120/SC2119 on the library's
      # optional-argument functions (called with args only from child hooks
      # shellcheck cannot see) and SC2317 on trap/dispatch-invoked functions.
      # Fetch the official static binary and verify its SHA256, mirroring how the
      # Dockerfile fetches and checks its release assets.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          echo "$PWD/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # The file lists live in the Makefile (scripts found by their shebang), so
      # CI and `make lint` check the same files. The hook and the entrypoint
      # scripts run under the image's /bin/sh (dash) and must parse as POSIX sh
      # under dash (on the runner) and busybox ash. busybox is the static
      # binary of the official image, pinned by tag and index digest, copied
      # out of a stopped container. LINT_REQUIRE=1 fails the step when a linter
      # is missing instead of skipping it.
      - name: shellcheck + POSIX sh syntax (dash -n, busybox sh -n)
        env:
          BUSYBOX_IMAGE: busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
        run: |
          set -euo pipefail
          mkdir -p busybox-bin
          cid=$(docker create "$BUSYBOX_IMAGE")
          docker cp "$cid:/bin/busybox" busybox-bin/busybox
          docker rm "$cid" > /dev/null
          busybox-bin/busybox true
          busybox-bin/busybox --help 2>&1 | sed -n 1p || true
          echo "$PWD/busybox-bin" >> "$GITHUB_PATH"
          PATH="$PWD/busybox-bin:$PATH" make lint-shell lint-posix LINT_REQUIRE=1

      - name: typos
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # zizmor (workflow security audit) and rumdl (markdown) both ship on PyPI;
      # install them with pipx (preinstalled on the runner) at the same versions
      # used locally so CI mirrors `make lint`. GH_TOKEN lets zizmor run its
      # online audits (known-vulnerable action checks).
      - name: zizmor (workflow security)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.31.1
          zizmor .github/workflows

      - name: rumdl (markdown)
        run: |
          pipx install rumdl==0.3.2
          rumdl check .

  # Single source of truth for the build matrix: the Makefile's PHP_VERSIONS
  # (and the Dockerfile's PHP_VER default, via the Makefile). Every workflow
  # matrix reads this job's outputs instead of hardcoding the version list, so
  # adding/removing a PHP line is one Makefile edit and cannot drift.
  php-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php: ${{ steps.read.outputs.php }}
      default-php: ${{ steps.read.outputs.default-php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: read the php matrix from the Makefile
        id: read
        run: |
          set -euo pipefail
          {
            echo "php=$(make print-php-matrix)"
            echo "default-php=$(make print-default-php)"
          } >> "$GITHUB_OUTPUT"

  build-test:
    needs: php-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      security-events: write # upload the trivy SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php-matrix.outputs.php) }}
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds php<ver> and runs the end-to-end smoke test and the TAP tests of
      # the Drupal entrypoint scripts (test/scripts.sh) against it. The
      # Makefile forwards DOCKER_BUILD_EXTRA to `docker build`, so wire buildx's
      # GitHub Actions layer cache here: --load drops the built image into the
      # local daemon (the smoke test and trivy run `docker run`/scan against it),
      # and a per-PHP cache scope keeps the matrix legs from clobbering each
      # other's apt/download layers across runs.
      - name: build + smoke and scripts tests
        env:
          DOCKER_BUILD_EXTRA: >-
            --load
            --cache-from type=gha,scope=php${{ matrix.php }}
            --cache-to type=gha,mode=max,scope=php${{ matrix.php }}
        run: make test DEFAULT_PHP="$PHP"

      # Report-only CVE scan, reusing the image just built on the default-PHP
      # leg (the base layers are shared, so one representative variant
      # suffices) instead of a separate job that rebuilds from scratch. Emit
      # SARIF and upload it to code scanning so findings land in the Security
      # tab and are tracked over time, instead of scrolling past in the build
      # log. Base-image / sury CVEs are outside this repo's control, so a
      # finding informs (exit-code 0) rather than blocks; tighten to exit-code
      # 1 if desired.
      # The ref is the local build tag `make test` gives the image
      # (freeunit-drupal:local-php<X.Y>, see the Makefile).
      - name: trivy image scan + SARIF upload
        if: matrix.php == needs.php-matrix.outputs.default-php
        uses: ./.github/actions/trivy-sarif
        with:
          image-ref: freeunit-drupal:local-php${{ matrix.php }}
          category: trivy-image

  # End-to-end test of examples/drupal against the image of this commit: the
  # base is rebuilt from the layer cache build-test wrote (read only here), the
  # site image keeps its own cache scope. tests/e2e.sh generates the secrets
  # and masks them, publishes no port and removes what it created. A composer
  # audit finding of the example lock is reported (TODO), not fatal, on push
  # and PR; example-search and release.yml block on it.
  example-e2e:
    needs: [php-matrix, build-test]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PHP: ${{ needs.php-matrix.outputs.default-php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build + example e2e test
        env:
          E2E_AUDIT: report
        run: |
          set -euo pipefail
          export DOCKER_BUILD_EXTRA="--load --cache-from type=gha,scope=php${PHP}"
          export E2E_BUILD_EXTRA="--cache-from type=gha,scope=example-php${PHP} --cache-to type=gha,mode=max,scope=example-php${PHP}"
          make test-example DEFAULT_PHP="$PHP"

  # The same test with the compose profile search (OpenSearch), weekly and on
  # demand; a composer audit finding fails it.
  example-search:
    needs: php-matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PHP: ${{ needs.php-matrix.outputs.default-php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build + example e2e test with search
        env:
          E2E_AUDIT: block
        run: |
          set -euo pipefail
          export DOCKER_BUILD_EXTRA="--load --cache-from type=gha,scope=php${PHP}"
          export E2E_BUILD_EXTRA="--cache-from type=gha,scope=example-php${PHP}"
          make test-example DEFAULT_PHP="$PHP" E2E_ARGS=--search
