name: security-scan

# Weekly CVE re-scan of the *published* images. ci.yml only scans on push/PR, so
# a vulnerability disclosed in the Debian base or the sury PHP packages after a
# release would go unnoticed until the next build. This re-scans what is actually
# in GHCR and uploads the results to code scanning, so they surface in the
# Security tab. Report-only: base/sury CVEs are outside this repo's control.
on:
  schedule:
    - cron: "41 6 * * 2" # Tuesdays 06:41 UTC (offset from check-upstream's Monday)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  # Single source for the PHP matrix: the Makefile's PHP_VERSIONS (see ci.yml).
  php-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php: ${{ steps.read.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: read the php matrix from the Makefile
        id: read
        run: echo "php=$(make print-php-matrix)" >> "$GITHUB_OUTPUT"

  trivy:
    needs: php-matrix
    runs-on: ubuntu-latest
    # Cap a hung image pull/scan well below GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the image to scan (works for a private GHCR package too)
      security-events: write # upload the SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php-matrix.outputs.php) }}
    env:
      PHP: ${{ matrix.php }}
    steps:
      # Checkout is needed only to resolve the local ./.github/actions/* used
      # below (a `uses: ./...` step runs from the workspace copy).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-source the registry path from the repo owner (lowercased, as GHCR
      # requires). There is no floating per-PHP tag, so scan <version>-php<X.Y>
      # of the latest GitHub release, i.e. the newest published image.
      - name: derive image ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-pre-releases --exclude-drafts \
            --json tagName,isLatest -q 'map(select(.isLatest)) | .[0].tagName')
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "unexpected latest release tag: '$tag'" >&2
            exit 1
          fi
          ref="ghcr.io/${owner}/freeunit-drupal:${tag#v}-php${PHP}"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"

      - name: log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # The matrix comes from the Makefile of HEAD, the tag from the last
      # release: a PHP line added after that release has no image yet, so its
      # leg is skipped with a notice. Any other registry error fails the leg.
      - name: check the image exists
        id: exists
        run: |
          set -euo pipefail
          if out=$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [[ "$out" == *": not found"* ]]; then
            echo "::notice::$IMAGE_REF is not published (PHP line newer than the last release), skipping the scan"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot check $IMAGE_REF: $out"
            exit 1
          fi

      - name: trivy scan published image + SARIF upload
        if: steps.exists.outputs.found == 'true'
        uses: ./.github/actions/trivy-sarif
        with:
          image-ref: ${{ env.IMAGE_REF }}
          category: trivy-published-php${{ matrix.php }}
