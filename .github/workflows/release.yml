name: release

# Tag-driven release: build + smoke-test the PHP matrix, push the images to
# GHCR, then cut a GitHub Release with notes lifted from CHANGELOG.md.
# Trigger:  git tag -a vX.Y.Z && git push --follow-tags
on:
  push:
    tags: ["v*"]

# Least privilege at the top; the jobs that need more opt in explicitly.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Every job carries a timeout-minutes cap: a hung docker push or Sigstore/
  # Rekor call would otherwise hold the runner for GitHub's 6-hour default.
  #
  # Single source for the PHP matrix: the Makefile's PHP_VERSIONS (see ci.yml).
  php-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php: ${{ steps.read.outputs.php }}
      default-php: ${{ steps.read.outputs.default-php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: read the php matrix from the Makefile
        id: read
        run: |
          {
            echo "php=$(make print-php-matrix)"
            echo "default-php=$(make print-default-php)"
          } >> "$GITHUB_OUTPUT"

  # End-to-end test of examples/drupal (see ci.yml) on a build of the tagged
  # commit, before anything is pushed: no leg of `images` publishes while it is
  # red. It tests its own build, not the pushed digest; both come from the same
  # commit and pins. A composer audit finding of the example lock fails it.
  example-e2e:
    needs: php-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PHP: ${{ needs.php-matrix.outputs.default-php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build + example e2e test
        env:
          E2E_AUDIT: block
        run: |
          set -euo pipefail
          export DOCKER_BUILD_EXTRA="--load --cache-from type=gha,scope=php${PHP}"
          export E2E_BUILD_EXTRA="--cache-from type=gha,scope=example-php${PHP}"
          make test-example DEFAULT_PHP="$PHP"

  images:
    needs: [php-matrix, example-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push to GHCR via the built-in GITHUB_TOKEN
      id-token: write # keyless (OIDC) signing for the attestations below
      attestations: write # record the provenance + SBOM attestations
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php-matrix.outputs.php) }}
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-source the release coordinates from the Dockerfile ARGs (same as
      # the Makefile) so this workflow needs no edit on a version bump. GHCR
      # requires a lowercase image path, hence the owner is downcased.
      - name: derive image coordinates
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "IMAGE=${REGISTRY}/${owner}/freeunit-drupal"
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "DEFAULT_PHP=$(sed -n 's/^ARG PHP_VER=\([^[:space:]]*\).*/\1/p' Dockerfile)"
          } >> "$GITHUB_ENV"

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuses the Makefile target: builds php$PHP as $IMAGE:local-php$PHP, with
      # the base pinned by the Dockerfile's digest table, then runs the
      # end-to-end smoke test against it. Wire buildx's GitHub Actions
      # layer cache read-only: ci.yml populated scope=php<ver> on the merge
      # commit minutes earlier (default-branch caches are readable from a tag
      # ref), so release reuses those layers instead of a cold rebuild. --load
      # drops the image into the daemon for the smoke test + tag/push that
      # follow. No --cache-to: release shouldn't compete with CI for cache writes
      # and a miss just falls back to a full build.
      - name: build + smoke test
        env:
          DOCKER_BUILD_EXTRA: >-
            --load
            --cache-from type=gha,scope=php${{ matrix.php }}
        run: make test DEFAULT_PHP="$PHP" IMAGE="$IMAGE"

      - name: log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # The immutable tags carry the image version: <version>-php<X.Y> and, on
      # the default PHP line, the bare <version>. None may exist yet: a rebuilt
      # image never has the published digest, so overwriting one would silently
      # change what a pinned tag means. Checked before anything is pushed, so a
      # refused run leaves the registry untouched.
      - name: refuse existing immutable tags
        run: |
          set -euo pipefail
          tags="$IMAGE:${VERSION}-php${PHP}"
          if [ "$PHP" = "$DEFAULT_PHP" ]; then
            tags="$tags $IMAGE:${VERSION}"
          fi
          status=0
          for tag in $tags; do
            # Only "not found" counts as absent: a registry or auth error must not
            # let the run go on and overwrite a tag it could not see.
            if out=$(docker buildx imagetools inspect "$tag" 2>&1); then
              echo "::error::immutable tag $tag already exists; a partial release is finished by hand, see the comment on the push version tag step"
              status=1
            elif [[ "$out" != *": not found"* ]]; then
              echo "::error::cannot check $tag: $out"
              status=1
            fi
          done
          exit "$status"

      # This PHP line has no floating tag, so the image is pushed under its
      # immutable <version>-php<X.Y> tag first; the attestations bind to the
      # digest it resolves to. If a later step of this job fails, a re-run is
      # refused by the check above: delete the <version>-php<X.Y> package
      # version in GHCR (it was never announced: default-tags and the release
      # job wait for every leg) and re-run, or finish the remaining steps by
      # hand.
      - name: push version tag
        run: |
          set -euo pipefail
          versioned="$IMAGE:${VERSION}-php${PHP}"
          docker tag "$IMAGE:local-php${PHP}" "$versioned"
          docker push "$versioned"
          digest=$(docker buildx imagetools inspect "$versioned" --format '{{ .Manifest.Digest }}')
          {
            echo "IMAGE_DIGEST=$digest"
            echo "IMAGE_REF=$versioned"
          } >> "$GITHUB_ENV"

      # Scan the just-built image into an SPDX SBOM (from the local daemon, so no
      # re-pull). Artifact upload is off: the SBOM is published as an attestation
      # below, and parallel matrix legs would collide on a shared artifact name.
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Keyless (OIDC) provenance + SBOM attestations, pushed to GHCR as OCI
      # referrers of the image manifest. Verify with:
      #   gh attestation verify oci://$IMAGE@$DIGEST --owner <owner>
      # Both write a Sigstore public-good Rekor transparency-log entry, which
      # intermittently times out ("error creating tlog entry"). GitHub Actions
      # has no native retry for `uses:` steps, so each attestation runs once with
      # continue-on-error and is re-run by a guarded step only when the first
      # attempt failed — riding out a transient tlog flake without failing the
      # whole release.
      - name: attest build provenance
        id: provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: attest build provenance (retry)
        if: steps.provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      # actions/attest-sbom is deprecated; actions/attest is its successor and
      # accepts the same inputs (sbom-path creates the SBOM attestation).
      - name: attest SBOM
        id: sbom
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM (retry)
        if: steps.sbom.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"

  # The bare <version> and :latest move only after every PHP leg of `images`
  # succeeded (pushed, smoke-tested and attested its <version>-php<X.Y>), so a
  # failing leg leaves the "current release" pointers where they were. Both
  # point at the attested digest of <version>-php<default>, read back from the
  # registry. Re-running this job is safe: an existing <version> on that digest
  # is kept, on another digest it is an error; :latest is overwritten.
  default-tags:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout (default PHP from the Dockerfile, local action)
      packages: write # create the tags in GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # A registry-side copy, no re-push of layers. --prefer-index=false copies
      # the single manifest as is; by default buildx wraps it in a new index
      # with another digest. :latest goes last.
      - name: push version and latest tags
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="${REGISTRY}/${owner}/freeunit-drupal"
          version=${GITHUB_REF_NAME#v}
          default_php=$(sed -n 's/^ARG PHP_VER=\([^[:space:]]*\).*/\1/p' Dockerfile)
          : "${default_php:?could not read ARG PHP_VER from the Dockerfile}"
          digest=$(docker buildx imagetools inspect "$image:${version}-php${default_php}" --format '{{ .Manifest.Digest }}')
          for tag in "$image:${version}" "$image:latest"; do
            if [ "$tag" = "$image:${version}" ]; then
              if got=$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}' 2>&1); then
                if [ "$got" != "$digest" ]; then
                  echo "::error::$tag already exists on $got, expected $digest"
                  exit 1
                fi
                echo "$tag already on $digest"
                continue
              elif [[ "$got" != *": not found"* ]]; then
                echo "::error::cannot check $tag: $got"
                exit 1
              fi
            fi
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$image@$digest"
            got=$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')
            if [ "$got" != "$digest" ]; then
              echo "::error::$tag resolves to $got, expected $digest"
              exit 1
            fi
            echo "$tag -> $digest"
          done

      - name: log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"

  release:
    needs: default-tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull just this version's section out of CHANGELOG.md for the release body
      # (everything between this `## [x.y.z]` heading and the next `## [`).
      - name: extract changelog section
        run: |
          version=${GITHUB_REF_NAME#v}
          # Grab the section between this version's `## [x.y.z]` heading and the
          # next `## [`, skipping link-reference definitions (`[x.y.z]: https://...`)
          # that sit at the file's foot and would otherwise tail the last section.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab && /^\[[^][]*\]:[[:space:]]/ { next }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: no CHANGELOG.md section for $version" >&2
            exit 1
          fi
          # Gate on the Russian changelog carrying the same version, so the
          # translated sibling can't silently fall out of sync at release time.
          if ! grep -q "^## \[${version}\]" CHANGELOG.ru.md; then
            echo "ERROR: no CHANGELOG.ru.md section for $version (translate it before tagging)" >&2
            exit 1
          fi

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
