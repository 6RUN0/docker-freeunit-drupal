# Bump PRs for pinned references; all land on develop, main receives only
# fast-forwards at release time. A week of cooldown keeps a yanked or
# compromised upstream release out of the auto-PR (zizmor: dependabot-cooldown).
#
# Not covered: the image's own base (`FROM ${BASE_IMAGE}:...`, ARG-interpolated,
# unparseable for Dependabot), supercronic and Composer (check-upstream.yml),
# and composer.lock of examples/drupal (bumped by hand at each image release).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: docker
    directory: "/examples/drupal"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies", "examples"]

  - package-ecosystem: docker-compose
    directory: "/examples/drupal"
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies", "examples"]
